[project]
name = "dataguard-ai"
version = "0.1.0"
description = "Evidence-gated data incident response learning project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "duckdb>=1.1,<2.0",
  "pydantic>=2.8,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
